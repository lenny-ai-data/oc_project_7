[project]
name = "p7"
version = "0.1.0"
description = "Systeme RAG pour la recommandation d evenements culturels"
readme = "README.md"
authors = [
    { name = "L. Jacquinot", email = "315764128+lenny-ai-data@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-mistralai>=1.1.6",
    "pandas>=3.0.5",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "missingno>=0.5.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # permet aux tests d'importer le dossier rag/
testpaths = ["tests"]
