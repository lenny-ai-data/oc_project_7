[project]
name = "p7"
version = "0.1.0"
description = "Systeme RAG pour la recommandation d evenements culturels"
readme = "README.md"
authors = [
    { name = "L. Jacquinot", email = "315764128+lenny-ai-data@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-mistralai>=1.1.6",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "missingno>=0.5.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ragas>=0.4.3",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # permet aux tests d'importer le dossier rag/
testpaths = ["tests"]

[tool.coverage.run]
source = ["rag", "api"]

[tool.coverage.report]
# Les blocs `python -m` servent à lancer et visualiser une étape à la main : ce
# n'est pas de la logique métier, et les tester reviendrait à tester des print
exclude_also = ["if __name__ == .__main__.:"]
